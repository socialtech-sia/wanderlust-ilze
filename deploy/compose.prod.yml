# Стек wanderlust. Один контейнер: SSR-сервер TanStack Start на Node.
#
# Traefik в стек НЕ входит — он общий и уже стоит на машине (/etc/traefik).
# Подключение только лейблами на своём контейнере; общий конфиг мы не трогаем.
#
# Тег образа задаёт deploy.sh через TAG. Вручную:
#   TAG=<sha> docker compose -f /opt/wanderlust/compose.yml --env-file /opt/wanderlust/.env up -d

services:
  wanderlust-web:
    image: ghcr.io/socialtech-sia/wanderlust:${TAG:?задайте TAG (deploy.sh делает это сам)}
    container_name: wanderlust-web
    restart: unless-stopped

    # ---------------------------------------------------------------------
    # Память. На машине живут два чужих продакшена, и одиннадцать контейнеров
    # демо-Supabase работают без mem_limit (oom_score_adj=0). При нехватке памяти
    # ядро выбирает жертву по размеру процесса — то есть новый процесс без
    # потолка конкурировал бы напрямую с их Postgres. Crawo решил это для себя,
    # объявив свои контейнеры предпочтительной жертвой; здесь та же договорённость.
    #
    # 768 МБ — с большим запасом: замер на реальной сборке дал ~44 МБ RSS в покое.
    # Потолок нужен не для экономии, а чтобы утечка в SSR уронила нас, а не соседа.
    mem_limit: 768m
    oom_score_adj: 500

    # Секреты и настройки — из файла на хосте, не из образа и не из git.
    env_file: /opt/wanderlust/.env

    # Только сеть Traefik. Своей внутренней сети у стека нет и не нужно:
    # в Supabase контейнер ходит по публичному адресу api.wanderlust.lv, через
    # тот же Traefik. Так сделано намеренно — адрес обязан совпадать с тем, что
    # вшит в клиентский бандл, иначе собранные на сервере ссылки на файлы
    # storage уехали бы в браузер с недостижимым хостом.
    networks: [traefik-public]

    # ports: здесь нет и не будет. Наружу контейнер видит только Traefik,
    # ровно как у обоих соседей по машине.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # healthcheck не дублируется: он зашит в образ (deploy/Dockerfile) и
    # наследуется. Два описания разъезжаются, одно — нет.

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      # Боевые хосты плюс стейджинговый. Под HostRegexp соседа
      # (^[a-z0-9-]+\.crawo\.socialtech\.technology$) ни один не подпадает:
      # там обязателен сегмент `.crawo.`. Явный priority не нужен — пересечения
      # маршрутов нет.
      #
      # wanderlust.socialtech.technology оставлен намеренно: по нему стек можно
      # проверять, не трогая боевой домен, и через него же идёт откат, если с
      # wanderlust.lv что-то не так.
      #
      # www не редиректится на апекс лейблами: канонический адрес приложение и
      # так отдаёт само (src/lib/seo.ts — SITE_URL захардкожен на apex, оттуда же
      # canonical, hreflang и sitemap), поэтому дублей в индексе не будет, а
      # лишний middleware — это лишнее место, где что-то отвалится.
      - traefik.http.routers.wanderlust.rule=Host(`wanderlust.lv`) || Host(`www.wanderlust.lv`) || Host(`wanderlust.socialtech.technology`)
      - traefik.http.routers.wanderlust.entrypoints=websecure
      - traefik.http.routers.wanderlust.tls=true
      # Резолвер le — TLS-ALPN-01, тот же, которым пользуется демо SRC. Ему не
      # нужен токен Cloudflare, и сертификат не попадает в acme-dns.json соседа.
      - traefik.http.routers.wanderlust.tls.certresolver=le
      # Сжатие. Traefik его сам не делает, а nitro-сервер отдавал ассеты сырыми:
      # index-*.js уезжал в браузер как 490 КБ, styles-*.css как 116 КБ, и это
      # при полностью текстовом содержимом. Проверялось запросом с
      # Accept-Encoding: gzip, br — заголовка content-encoding в ответе не было
      # вовсе. На медленной мобильной сети это и давало FCP около девяти секунд.
      #
      # Middleware объявлен здесь же, на своём контейнере, как и wanderlust-sec:
      # общий конфиг Traefik мы не трогаем.
      - traefik.http.routers.wanderlust.middlewares=wanderlust-compress,wanderlust-sec
      - traefik.http.middlewares.wanderlust-compress.compress=true
      # Порог: сжимать нет смысла на крошечных ответах, там накладные расходы
      # больше выигрыша.
      - traefik.http.middlewares.wanderlust-compress.compress.minResponseBodyBytes=1024
      - traefik.http.services.wanderlust.loadbalancer.server.port=3000
      # Middleware объявлен ЗДЕСЬ ЖЕ, на своём контейнере, а не в общем месте.
      # Traefik собирает middleware из лейблов контейнеров: объявленный на одном
      # контейнере, он исчезает вместе с ним при пересоздании, и все роутеры,
      # которые на него ссылаются, начинают отдавать 404. У соседа это уже
      # случалось — поэтому у него определение crawo-sec продублировано на каждом
      # контейнере. Здесь контейнер один; строки остаются на месте, если их станет два.
      - traefik.http.middlewares.wanderlust-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.wanderlust-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.wanderlust-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.wanderlust-sec.headers.frameDeny=true
      - traefik.http.middlewares.wanderlust-sec.headers.referrerPolicy=strict-origin-when-cross-origin

networks:
  # Общая сеть существующего Traefik. Создана не нами, external.
  traefik-public:
    external: true
